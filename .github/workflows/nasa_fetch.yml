name: Fetch NASA FIRMS Data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas geopandas scikit-learn shapely requests tqdm numpy

      - name: Run NASA script
        run: python script_nasa.py

      - name: Commit and push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/output/feux NASA/feux_sud_ouest.csv"
          git diff --cached --quiet || git commit -m "chore: update NASA FIRMS data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
